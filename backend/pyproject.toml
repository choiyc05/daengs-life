[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    # D-001 오케스트레이션 · RT-001 ④. `ml` 처럼 그룹으로 빼지 않는 이유는 crawler 와 같다 —
    # 가볍고, 워커·웹이 같은 이미지에서 같은 코드를 import 한다 (D-009 의존성 그룹 절)
    "celery>=5.5",
    "redis>=6.0",
    "fastapi[standard]>=0.141.1",
    "google-genai>=2.18.1",
    "httpx>=0.28.1",
    "lxml>=6.1.2",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "tzdata>=2026.3",
]

# 앱 런타임과 섞지 않으려고 그룹화
# `uv sync --group ml`을 해야 설치.
[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
ml = [
    "torch>=2.6",
    "sentence-transformers>=3.4",
    "transformers<5",
    "pyarrow>=18",
    "numpy>=2",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32'" }]

[tool.pytest.ini_options]
# backend/ 를 sys.path 에 올려 tests/ 에서 crawler 를 import 할 수 있게 한다
# (tests/ 는 패키지가 아니라 pytest 가 backend/ 를 자동으로 넣어주지 않는다)
pythonpath = ["."]
testpaths = ["tests"]
